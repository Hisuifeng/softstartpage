<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <title>轻-soft 起始页</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="wallpaper-layer" class="hidden" data-parallax="1.2" data-parallax-max="26"></div>
    <canvas id="particle-canvas"></canvas>
    <!-- 新增雨滴画布 -->
    <canvas id="rain-canvas"></canvas>

    <div class="main-container" id="mainContainer">
        <div class="time-section" id="timeSectionTrigger">
            <div class="clock" id="clock">--:--</div>
            <div class="date-text" id="dateText"></div>
        </div>
        <div class="search-section" id="searchSection">
            <div class="search-wrapper">
                <div class="search-icon">
                    <svg viewBox="0 0 24 24">
                        <circle cx="10.5" cy="10.5" r="7.5" />
                        <line x1="16" y1="16" x2="21" y2="21" />
                    </svg>
                </div>
                <input type="text" class="search-input" id="searchInput" placeholder="在 Google 上搜索" autofocus
                    autocomplete="off" spellcheck="false">
                <button class="search-clear" id="searchClear"><span class="svg-icon" aria-hidden="true" data-svg="close"></span></button>
            </div>
            <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
            <div class="engine-switcher" id="engineSwitcher"></div>
        </div>
        <div class="bookmarks-section" id="bookmarksSection"></div>
    </div>

    <!-- 天气按钮（左下角） -->
    <button class="weather-fab" id="weatherFab" title="天气详情">
        <span id="weatherFabIcon"><span class="svg-icon" aria-hidden="true" data-svg="sun"></span></span>
        <div class="weather-fab-text" id="weatherFabText">获取中...</div>
    </button>

    <button class="settings-fab" id="settingsFab" title="设置"><span class="svg-icon" aria-hidden="true" data-svg="settings"></span></button>

    <!-- 世界时钟 -->
    <div class="world-clock-overlay" id="worldClockOverlay">
        <div class="world-clock-panel">
            <div class="world-clock-header">
                <h2><span class="svg-icon" aria-hidden="true" data-svg="globe"></span> 世界时钟</h2>
                <button class="settings-close-btn" id="closeWorldClockBtn"><span class="svg-icon" aria-hidden="true" data-svg="close"></span></button>
            </div>
            <div class="world-clock-body">
                <div class="world-clock-add">
                    <select class="settings-select" id="timezonePreset">
                        <option value="">选择常用时区...</option>
                        <option value="UTC+0">伦敦 (UTC+0)</option>
                        <option value="UTC+8">北京/上海 (UTC+8)</option>
                        <option value="UTC+9">东京 (UTC+9)</option>
                        <option value="UTC-5">纽约 (UTC-5)</option>
                        <option value="UTC-8">洛杉矶 (UTC-8)</option>
                        <option value="UTC+1">巴黎 (UTC+1)</option>
                        <option value="UTC+5:30">孟买 (UTC+5:30)</option>
                        <option value="UTC+11">悉尼 (UTC+11)</option>
                    </select>
                    <input type="text" class="settings-input" id="customTimezoneInput" placeholder="手动输入 UTC±HH:MM">
                    <button class="btn primary" id="addTimezoneBtn">添加</button>
                </div>
                <div class="timezone-list" id="timezoneList"></div>
            </div>
        </div>
    </div>

    <!-- 天气详情面板 -->
    <div class="weather-overlay" id="weatherOverlay">
        <div class="weather-panel">
            <div class="weather-panel-header">
                <h2><span class="svg-icon" aria-hidden="true" data-svg="weather"></span> 天气详情</h2>
                <div style="display:flex; gap:8px;">
                    <button class="settings-close-btn" id="refreshWeatherBtn" title="刷新天气"><span
                            class="svg-icon" aria-hidden="true" data-svg="refresh"></span></button>
                    <button class="settings-close-btn" id="closeWeatherBtn"><span class="svg-icon" aria-hidden="true"
                            data-svg="close"></span></button>
                </div>
            </div>
            <div class="weather-panel-body">
                <div class="weather-main-info" id="weatherMainInfo"></div>
                <div class="weather-chart-legend">
                    <span class="legend-item"><span class="legend-color" style="background: var(--temp-color);"></span>
                        温度</span>
                    <span class="legend-item"><span class="legend-color" style="background: var(--feel-color);"></span>
                        体感</span>
                    <span class="legend-item"><span class="legend-color"
                            style="background: var(--precip-color);"></span> 降水</span>
                </div>
                <div class="weather-chart-scroll">
                    <div class="weather-chart-container" id="weatherChartContainer">
                        <canvas id="weatherChartCanvas"></canvas>
                        <div class="chart-tooltip" id="chartTooltip"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 设置面板 -->
    <div class="settings-overlay" id="settingsOverlay">
        <div class="settings-panel">
            <div class="settings-panel-header">
                <h2><span class="svg-icon" aria-hidden="true" data-svg="settings"></span> 设置</h2>
                <button class="settings-close-btn" id="settingsCloseBtn"><span class="svg-icon" aria-hidden="true"
                        data-svg="close"></span></button>
            </div>
            <div class="settings-panel-body">
                <div class="settings-group">
                    <div class="settings-group">
                        <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                                data-svg="location"></span>自定义经纬度</div>
                        <div class="settings-row" style="flex-direction:column; align-items:flex-start;">
                            <div style="display:flex; gap:8px; width:100%; align-items:center;">
                                <input type="number" class="settings-input" id="customLatInput"
                                    placeholder="纬度 (如 39.9)" step="any" style="flex:1;">
                                <input type="number" class="settings-input" id="customLonInput"
                                    placeholder="经度 (如 116.4)" step="any" style="flex:1;">
                                <button class="btn primary" id="applyCustomCoords">应用</button>
                            </div>
                            <span
                                style="font-size:0.75rem; color:var(--text-tertiary); margin-top:4px;">留空则自动使用IP定位</span>
                        </div>
                    </div>
                    <div class="settings-group">
                        <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                                data-svg="rain"></span>动态背景</div>
                        <div class="settings-row">
                            <span class="settings-row-label">启用雨效</span>
                            <label class="toggle-switch"><input type="checkbox" id="toggleWeatherEffect" checked><span
                                    class="toggle-slider"></span></label>
                        </div>
                        <div class="settings-row">
                            <span class="settings-row-label">粒子背景</span>
                            <label class="toggle-switch"><input type="checkbox" id="toggleParticles" checked><span
                                    class="toggle-slider"></span></label>
                        </div>
                        <div class="settings-row">
                            <span class="settings-row-label">视差背景</span>
                            <label class="toggle-switch"><input type="checkbox" id="toggleParallax" checked><span
                                    class="toggle-slider"></span></label>
                        </div>
                    </div>
                    <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                            data-svg="clock"></span>时间格式</div>
                    <div class="settings-row">
                        <span class="settings-row-label">24小时制</span>
                        <label class="toggle-switch"><input type="checkbox" id="toggle24Hour"><span
                                class="toggle-slider"></span></label>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">显示秒</span>
                        <label class="toggle-switch"><input type="checkbox" id="toggleSeconds"><span
                                class="toggle-slider"></span></label>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">日期格式</span>
                        <select class="settings-select" id="selectDateFormat">
                            <option value="cn">YYYY年MM月DD日</option>
                            <option value="iso">YYYY-MM-DD</option>
                            <option value="us">MM/DD/YYYY</option>
                            <option value="uk">DD/MM/YYYY</option>
                        </select>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-label"><span class="svg-icon" aria-hidden="true" data-svg="image"></span>壁纸
                    </div>
                    <div class="settings-row" style="flex-direction:column; align-items:flex-start;">
                        <div style="display:flex; gap:8px; width:100%; align-items:center;">
                            <input type="text" class="settings-input" id="wallpaperUrlInput" placeholder="输入网络图片URL">
                            <button class="btn" id="applyUrlWallpaper">应用</button>
                        </div>
                        <div class="wallpaper-actions" style="margin-top:8px;">
                            <label class="file-upload-label" for="wallpaperFileInput"><span
                                    class="svg-icon" aria-hidden="true" data-svg="folder"></span>上传本地图片</label>
                            <input type="file" class="file-upload-input" id="wallpaperFileInput" accept="image/*">
                            <button class="btn danger" id="clearWallpaper">清除壁纸</button>
                        </div>
                        <div class="wallpaper-preview" id="wallpaperPreview"></div>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">未设置时启用默认壁纸</span>
                        <label class="toggle-switch"><input type="checkbox" id="toggleDefaultWallpaper" checked><span
                                class="toggle-slider"></span></label>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                            data-svg="keyboard"></span>快捷键</div>
                    <div class="settings-row">
                        <span class="settings-row-label">切换引擎修饰键</span>
                        <select class="settings-select" id="selectModifierKey">
                            <option value="ctrl">Ctrl + 数字</option>
                            <option value="alt">Alt + 数字</option>
                            <option value="shift">Shift + 数字</option>
                            <option value="none">仅数字键 (焦点不在输入框)</option>
                        </select>
                    </div>
                </div>
                <div class="settings-group">
                    <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                            data-svg="search"></span>搜索与引擎</div>
                    <div class="settings-row">
                        <span class="settings-row-label">启用联想</span>
                        <label class="toggle-switch"><input type="checkbox" id="toggleSuggestions" checked><span
                                class="toggle-slider"></span></label>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">备用API</span>
                        <select class="settings-select" id="selectFallbackAPI">
                            <option value="baidu">百度</option>
                            <option value="bing">Bing</option>
                            <option value="google">Google</option>
                        </select>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">搜索历史</span>
                        <button class="btn danger" id="btnClearAllHistory">清除全部历史</button>
                    </div>
                    <div class="settings-group-label" style="margin-top:16px;"><span class="svg-icon" aria-hidden="true"
                            data-svg="wrench"></span>自定义搜索引擎</div>
                    <div class="custom-engines-list" id="customEnginesList"></div>
                    <button class="btn-add-bookmark" id="btnAddCustomEngine">+ 添加自定义引擎</button>
                </div>
                <div class="settings-group">
                    <div class="settings-group-label"><span class="svg-icon" aria-hidden="true"
                            data-svg="pin"></span>书签管理 <span
                            style="font-weight:400;font-size:0.8rem;color:var(--text-tertiary);">(可拖拽排序)</span></div>
                    <div class="bookmark-edit-list" id="bookmarkEditList"></div>
                    <button class="btn-add-bookmark" id="btnAddBookmark">+ 添加书签</button>
                </div>
            </div>
            <div class="settings-panel-footer">
                <button class="btn danger" id="btnResetDefaults">恢复默认</button>
                <div style="flex:1;"></div>
                <button class="btn" id="btnCancelSettings">取消</button>
                <button class="btn primary" id="btnSaveSettings">保存</button>
            </div>
        </div>
    </div>
    <div class="toast" id="toast"></div>
    <script src="js/utils.js" defer></script>
    <script src="js/particles.js" defer></script>
    <script src="js/parallax.js" defer></script>
    <script src="js/clock.js" defer></script>
    <script src="js/wallpaper.js" defer></script>
    <script src="js/engine.js" defer></script>
    <script src="js/search.js" defer></script>
    <script src="js/bookmarks.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/worldclock.js" defer></script>
    <script src="js/weather.js" defer></script>
    <script src="js/main.js" defer></script>
</body>

</html>
